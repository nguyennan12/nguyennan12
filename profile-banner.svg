<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" font-family="'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
@keyframes rise  {from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade  {from{opacity:0}to{opacity:1}}
@keyframes growx {from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growy {from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop   {from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes draw  {from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pulse {0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.9)}}
.a{transform-box:fill-box;transform-origin:center;animation-fill-mode:both;
   animation-duration:var(--t,.9s);animation-delay:var(--d,0s);
   animation-timing-function:cubic-bezier(.33,1,.68,1)}
.rise{animation-name:rise}.fade{animation-name:fade}.pop{animation-name:pop}
.growx{animation-name:growx}.growy{animation-name:growy}
.corner{stroke-dasharray:1;animation-name:draw}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}
</style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e3ebf2" stroke-width="1"/><animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="12s" repeatCount="indefinite"/></pattern>
  </defs>

  <rect width="1600" height="560" rx="18" fill="#fafcfe"/>
  <rect width="1600" height="560" rx="18" fill="url(#grid)"/>
  <rect x="4" y="4" width="1592" height="552" rx="16" fill="none" stroke="#c9d6e3" stroke-width="2"/>
  <g stroke="#33475b" stroke-width="3" fill="none" stroke-linecap="round">
    <path class="a corner" pathLength="1" style="--d:0.0s;--t:1s" d="M 40 70 L 40 40 L 70 40"/>
    <path class="a corner" pathLength="1" style="--d:0.1s;--t:1s" d="M 1530 40 L 1560 40 L 1560 70"/>
    <path class="a corner" pathLength="1" style="--d:0.2s;--t:1s" d="M 40 490 L 40 520 L 70 520"/>
    <path class="a corner" pathLength="1" style="--d:0.3s;--t:1s" d="M 1530 520 L 1560 520 L 1560 490"/>
  </g>

  <text class="a rise" style="--d:.3s" x="800" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="52" fill="#16232f">Du Nguyen An</text>

  <g class="a rise" style="--d:.6s">
    <rect x="660" y="138" width="280" height="42" rx="10" fill="#f2f6fa" stroke="#cfd8e3" stroke-width="1.5"/>
    <circle class="pulse" cx="695" cy="159" r="4.5" fill="#b8860b"/>
    <text x="810" y="165" text-anchor="middle" font-size="14" font-weight="600" letter-spacing="0.5" fill="#33475b">GITHUB&#160;&#183;&#160;1 FOLLOWER</text>
  </g>

  <rect class="a growx" style="--d:.95s;--t:.7s;transform-origin:100% 50%" x="740" y="198" width="60" height="4" fill="#2f6690"/>
  <rect class="a growx" style="--d:.95s;--t:.7s;transform-origin:0% 50%"   x="800" y="198" width="60" height="4" fill="#b8860b"/>

  <text class="a rise" style="--d:1s" x="800" y="247" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#33475b">Software Engineer</text>
  <text class="a rise" style="--d:1.15s" x="800" y="282" text-anchor="middle" font-size="18" letter-spacing="1.5" fill="#7c93a8">BACKEND ENGINEERING &#183; SYSTEM DESIGN &#183; DEVOPS</text>

  <line class="a growx" style="--d:1.3s;--t:1.3s;transform-origin:0% 50%" x1="200" y1="360" x2="1400" y2="360" stroke="#c9d6e3" stroke-width="2"/>
  <g font-size="17" letter-spacing="2" fill="#33475b" text-anchor="middle">
    <circle class="a pop" style="--d:1.38s;--t:.5s" cx="270" cy="360" r="9" fill="#fafcfe" stroke="#33475b" stroke-width="2.5"/>
    <circle class="a pop" style="--d:1.48s;--t:.5s" cx="270" cy="360" r="3" fill="#33475b"/>
    <circle class="a pop" style="--d:1.58s;--t:.5s" cx="305" cy="360" r="4" fill="#b8860b"/>
    <text class="a rise" style="--d:1.48s;--t:.6s" x="270" y="392">CODE</text>
    <circle class="a pop" style="--d:1.76s;--t:.5s" cx="620" cy="360" r="9" fill="#fafcfe" stroke="#33475b" stroke-width="2.5"/>
    <text class="a rise" style="--d:1.86s;--t:.6s" x="620" y="392">BUILD</text>
    <circle class="a pop" style="--d:2.16s;--t:.5s" cx="990" cy="360" r="9" fill="#fafcfe" stroke="#33475b" stroke-width="2.5"/>
    <text class="a rise" style="--d:2.26s;--t:.6s" x="990" y="392">SHIP</text>
    <circle class="a pop" style="--d:2.54s;--t:.5s" cx="1340" cy="360" r="9" fill="#fafcfe" stroke="#33475b" stroke-width="2.5"/>
    <text class="a rise" style="--d:2.64s;--t:.6s" x="1340" y="392">RUN</text>
  </g>

  <circle cx="270" cy="360" r="5" fill="#2f6690" opacity="0">
    <animate attributeName="cx" values="270;1340;1340" keyTimes="0;.7;1" dur="4.5s" begin="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.9;.9;0;0" keyTimes="0;.05;.65;.72;1" dur="4.5s" begin="3s" repeatCount="indefinite"/>
  </circle>

  <text class="a fade" style="--d:2.8s;--t:1s" x="800" y="440" text-anchor="middle" font-size="18" letter-spacing="2" fill="#7c93a8">LEARNING &#183; BUILDING &#183; GROWING</text>
</svg>
