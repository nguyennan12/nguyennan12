<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 260" font-family="'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e3ebf2" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1600" height="260" rx="18" fill="#fafcfe"/>
  <rect x="0" y="0" width="1600" height="260" rx="18" fill="url(#grid3)"/>
  <rect x="4" y="4" width="1592" height="252" rx="16" fill="none" stroke="#c9d6e3" stroke-width="2"/>

  <g stroke="#33475b" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 40 70 L 40 30 L 70 30"/>
    <path d="M 1530 30 L 1560 30 L 1560 70"/>
    <path d="M 40 230 L 40 230 L 40 190 M 40 230 L 70 230"/>
    <path d="M 1530 230 L 1560 230 L 1560 190"/>
  </g>

  <line x1="400" y1="45" x2="400" y2="215" stroke="#e3ebf2" stroke-width="1.5"/>
  <line x1="800" y1="45" x2="800" y2="215" stroke="#e3ebf2" stroke-width="1.5"/>
  <line x1="1200" y1="45" x2="1200" y2="215" stroke="#e3ebf2" stroke-width="1.5"/>

  <!-- Total Contributions -->
  <text x="200" y="80" text-anchor="middle" font-size="15" letter-spacing="2" fill="#7c93a8">TOTAL CONTRIBUTIONS</text>
  <text x="200" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="52" fill="#16232f">678</text>
  <rect x="150" y="164" width="100" height="4" rx="2" fill="#b8860b"/>
  <text x="200" y="200" text-anchor="middle" font-size="12" fill="#9aacba">JAN 1 2026 - PRESENT</text>

  <!-- Current Streak -->
  <text x="600" y="80" text-anchor="middle" font-size="15" letter-spacing="2" fill="#7c93a8">CURRENT STREAK</text>
  <text x="600" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="52" fill="#16232f">8</text>
  <rect x="550" y="164" width="100" height="4" rx="2" fill="#2f6690"/>
  <text x="600" y="200" text-anchor="middle" font-size="12" fill="#9aacba">SEP 9 - SEP 16 2026</text>

  <!-- Longest Streak -->
  <text x="1000" y="80" text-anchor="middle" font-size="15" letter-spacing="2" fill="#7c93a8">LONGEST STREAK</text>
  <text x="1000" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="52" fill="#16232f">63</text>
  <rect x="950" y="164" width="100" height="4" rx="2" fill="#6b46c1"/>
  <text x="1000" y="200" text-anchor="middle" font-size="12" fill="#9aacba">MAR 16 - MAY 17 2026</text>

  <!-- Public Repos -->
  <text x="1400" y="80" text-anchor="middle" font-size="15" letter-spacing="2" fill="#7c93a8">PUBLIC REPOS</text>
  <text x="1400" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="52" fill="#16232f">17</text>
  <rect x="1350" y="164" width="100" height="4" rx="2" fill="#3a8a5c"/>
</svg>
